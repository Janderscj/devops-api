version: '3.8'

services:
  # NODE.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: Devops-App-Prod
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - ./.env.production
    volumes:
      # Mount logs directly
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
        reservations:
          memory: 256M
          cpus: 0.25
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
